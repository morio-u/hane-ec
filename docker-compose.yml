version: '3.9'

services:
  web:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - db

  db:
    image: postgres:15
    environment:
      POSTGRES_USER: morio
      POSTGRES_PASSWORD: yourpassword
      POSTGRES_DB: hane_db
    ports:
      - "5432:5432"
